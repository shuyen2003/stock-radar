<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b2147"><meta name="apple-mobile-web-app-capable" content="yes"><title>台股飆股雷達 App</title><style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#19314a;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{padding:25px 18px 23px;background:linear-gradient(125deg,#0a2449,#1763ae);color:white}main{max-width:1040px;margin:auto;padding:16px}h1{font-size:25px;margin:0 0 6px}h2{font-size:18px;margin:0 0 14px}.subtitle{opacity:.9;font-size:13px}.card{background:white;border:1px solid #e5ebf3;border-radius:15px;padding:17px;margin:0 0 15px;box-shadow:0 2px 12px #203c5710}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:13px 8px;background:#edf4fc;border-radius:10px;text-align:center}.stat strong{display:block;font-size:19px;color:#135b9d}.stat span{font-size:12px;color:#637b92}.muted{color:#65778c;font-size:13px;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-size:13px;margin-bottom:6px;font-weight:600}input,select{width:100%;padding:11px;border:1px solid #cad6e5;border-radius:9px;font-size:16px;background:white;color:#19314a}input:focus,select:focus{outline:2px solid #448ed9}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}button{background:#1765b4;color:white;border:0;border-radius:9px;padding:11px 15px;font-size:15px;font-weight:600;cursor:pointer}.secondary{background:#e9f0f8;color:#1a5b96}.pill{display:inline-block;background:#eaf3fe;border-radius:20px;padding:5px 10px;font-size:12px;color:#155b9a}.table-scroll{overflow-x:auto;margin-top:12px}table{border-collapse:collapse;min-width:620px;width:100%;font-size:14px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #edf1f6}th{color:#647890;background:#f5f8fc;font-size:12px;white-space:nowrap}td{white-space:nowrap}.symbol{font-weight:700;color:#135fa6}.good{color:#07805a;font-weight:600}.note{line-height:1.7}#message{font-size:13px;color:#5b748e;margin-top:12px}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1}.inactive{background:#eaf1f8;color:#2a5d86}.warn{background:#fff7e9;color:#8d5919;padding:12px;border-radius:9px;margin-top:12px;font-size:13px;line-height:1.6}footer{text-align:center;font-size:12px;color:#8290a0;padding:10px 18px 28px}@media(max-width:450px){main{padding:12px}.card{padding:14px}.stats{grid-template-columns:repeat(3,1fr)}.stat strong{font-size:16px}h1{font-size:23px}}
</style></head><body><header><h1>📈 台股飆股雷達</h1><div class="subtitle">股票快速搜尋・技術面強勢股雷達</div></header><main>
<section class="card"><h2>最新資料狀態</h2><div class="stats"><div class="stat"><strong id="date">—</strong><span>行情日期</span></div><div class="stat"><strong id="days">—</strong><span>歷史交易日</span></div><div class="stat"><strong id="total">—</strong><span>可搜尋股票</span></div></div><div class="muted" id="status" style="margin-top:12px">載入資料中…</div></section>
<section class="card"><div class="tabs"><button id="allTab" onclick="setTab('all')">🔎 股票搜尋</button><button id="radarTab" class="inactive" onclick="setTab('radar')">🚀 飆股雷達</button></div><div class="grid"><div class="field" style="grid-column:1/-1"><label for="query">股票代號或名稱</label><input id="query" placeholder="例如：2330、台積電" autocomplete="off" oninput="render()"></div><div class="field"><label for="ratio">最低量比（20 日均量）</label><select id="ratio" onchange="render()"><option value="0">不限</option><option value="1.5">1.5 倍</option><option value="1.8">1.8 倍</option><option value="2">2 倍</option><option value="3">3 倍</option></select></div><div class="field"><label for="trend">技術條件</label><select id="trend" onchange="render()"><option value="all">不限</option><option value="breakout">20 日突破</option><option value="trend">均線多頭趨勢</option><option value="both">突破＋多頭趨勢</option></select></div><div class="field"><label for="sort">排序</label><select id="sort" onchange="render()"><option value="code">股票代號</option><option value="ratio">量比由高到低</option><option value="volume">成交量由高到低</option><option value="close">收盤價由高到低</option></select></div><div class="field"><label for="limit">顯示筆數</label><select id="limit" onchange="render()"><option>20</option><option>50</option><option>100</option><option>300</option></select></div></div><div class="toolbar"><button onclick="render()">開始搜尋</button><button class="secondary" onclick="resetFilters()">清除條件</button><span class="pill" id="mode">股票搜尋</span></div><div id="notice" class="warn" hidden></div><div id="message"></div><div class="table-scroll"><table><thead><tr><th>代號</th><th>名稱</th><th>收盤價</th><th>成交股數</th><th>量比</th><th>20日突破</th><th>均線趨勢</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section class="card"><h2>功能說明</h2><div class="muted note">「股票搜尋」可以在歷史資料不足 21 天時查詢已下載的上市股票。「飆股雷達」只顯示符合量比至少 1.8 倍、突破前 20 日收盤高點，以及均線條件的候選股。歷史資料不足時不會假造指標。上櫃、營收、三大法人與融資分析尚未納入此版。</div></section></main><footer>資料僅供研究，不構成投資建議。股價與成交量以來源公布日期為準。</footer>
<script>
let dataset={universe:[],stocks:[],history_days:0};let tab='all';
const el=id=>document.getElementById(id);
function setTab(value){tab=value;el('allTab').className=value==='all'?'':'inactive';el('radarTab').className=value==='radar'?'':'inactive';el('mode').textContent=value==='all'?'股票搜尋':'飆股候選';render()}
function resetFilters(){el('query').value='';el('ratio').value='0';el('trend').value='all';el('sort').value='code';render()}
function number(x){const n=Number(x);return Number.isFinite(n)?n:null}
function fmt(x,d=0){const n=number(x);return n===null?'—':n.toLocaleString('zh-TW',{maximumFractionDigits:d})}
function add(tr,value,cls=''){const td=document.createElement('td');td.textContent=String(value);if(cls)td.className=cls;tr.appendChild(td)}
function render(){const src=tab==='radar'?dataset.stocks:dataset.universe;const q=el('query').value.trim().toLowerCase();const ratio=Number(el('ratio').value);const trend=el('trend').value;let data=(Array.isArray(src)?src:[]).filter(s=>{if(q&&!String(s.code||'').toLowerCase().includes(q)&&!String(s.name||'').toLowerCase().includes(q))return false;if(ratio&&!(Number(s.volume_ratio)>=ratio))return false;if(trend==='breakout'&&!s.breakout20)return false;if(trend==='trend'&&!s.trend)return false;if(trend==='both'&&!(s.breakout20&&s.trend))return false;return true});const sort=el('sort').value;data.sort((a,b)=>sort==='code'?String(a.code).localeCompare(String(b.code)):Number(b[sort==='ratio'?'volume_ratio':sort]||0)-Number(a[sort==='ratio'?'volume_ratio':sort]||0));const count=data.length;data=data.slice(0,Number(el('limit').value));const rows=el('rows');rows.replaceChildren();for(const s of data){const tr=document.createElement('tr');add(tr,s.code||'—','symbol');add(tr,s.name||'—');add(tr,fmt(s.close,2));add(tr,fmt(s.volume));add(tr,s.volume_ratio==null?'資料不足':fmt(s.volume_ratio,2)+'x');add(tr,s.breakout20===undefined?'—':s.breakout20?'是':'否',s.breakout20?'good':'');add(tr,s.trend===undefined?'—':s.trend?'多頭':'否',s.trend?'good':'');rows.appendChild(tr)}el('message').textContent='符合條件：'+count+' 檔｜顯示：'+data.length+' 檔'+(count===0?'（目前沒有符合條件的股票）':'');el('notice').hidden=!(Number(dataset.history_days)<21||tab==='radar'&&dataset.stocks.length===0);el('notice').textContent=Number(dataset.history_days)<21?'歷史行情目前只有 '+dataset.history_days+' 個交易日；量比、突破、均線等條件需要 21 個有效交易日。可先用股票代號或名稱搜尋。':'目前沒有同時符合全部飆股條件的候選股票。'}
async function load(){try{const res=await fetch('./data/stocks.json?t='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const d=await res.json();if(!Array.isArray(d.stocks))throw Error('stocks 格式不正確');dataset=d;el('date').textContent=d.date||'—';el('days').textContent=d.history_days??'—';el('total').textContent=Array.isArray(d.universe)?d.universe.length:'—';el('status').textContent=d.status||'資料已載入';if(!Array.isArray(d.universe)){el('status').textContent+='｜目前是舊版資料，待更新程式執行後才會有完整股票搜尋清單。';dataset.universe=[]}render()}catch(e){el('status').textContent='讀取資料失敗：'+e.message;el('message').textContent='請檢查 GitHub Actions 資料更新紀錄。'}}load();
</script></body></html>
